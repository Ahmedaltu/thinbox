name: CI — Build & Robot Framework Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  checks: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build
  # ─────────────────────────────────────────────
  build:
    name: Build thinbox
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binary
        run: go build -v -o thinbox .

      - name: Go unit tests
        run: go test ./... -v 2>&1 | tee go-test.log || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: thinbox-binary
          path: thinbox
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 2: Robot Framework tests
  # ─────────────────────────────────────────────
  robot-tests:
    name: Robot Framework Tests
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download thinbox binary
        uses: actions/download-artifact@v4
        with:
          name: thinbox-binary
          path: .

      - name: Make binary executable
        run: chmod +x thinbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Robot Framework
        run: pip install robotframework==7.1 robotframework-lint

      - name: Lint RF files
        run: rflint tests/ resources/ || true

      - name: Prepare Alpine image for thinbox
        run: |
          sudo mkdir -p /var/lib/thinbox/images
          sudo wget -q \
            https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-minirootfs-3.19.1-x86_64.tar.gz \
            -O /var/lib/thinbox/images/alpine.tar

      - name: Run Robot Framework tests
        # Namespace syscalls (CLONE_NEWPID etc.) require root
        run: |
          sudo python -m robot \
            --outputdir results \
            --loglevel DEBUG \
            --report  report.html \
            --log     log.html \
            --output  output.xml \
            --xunit   xunit.xml \
            tests/
        continue-on-error: true

      - name: Upload RF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: |
            results/report.html
            results/log.html
            results/output.xml

      - name: Annotate PR with test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Robot Framework Results
          path: results/xunit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Fail if tests failed
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('results/output.xml')
          stat = tree.find('.//statistics/total/stat')
          failed = int(stat.get('fail', 0))
          print(f'Failed: {failed}')
          exit(1 if failed > 0 else 0)
          "