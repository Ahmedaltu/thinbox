<svg width="100%" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>thinbox container startup sequence</title>
  <desc>6 steps from thinbox run command to fully isolated process</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="190" y="30" width="300" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="54" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">thinbox run alpine /bin/sh</text>
  <text font-family="sans-serif" font-size="12" x="340" y="72" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">parse image name + command</text>
  <text font-family="sans-serif" font-size="12" x="30" y="62" text-anchor="start" fill="#b4b2a9">1</text>
  <line x1="340" y1="86" x2="340" y2="114" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="190" y="114" width="300" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="138" text-anchor="middle" dominant-baseline="central" fill="#26215c">Extract rootfs</text>
  <text font-family="sans-serif" font-size="12" x="340" y="156" text-anchor="middle" dominant-baseline="central" fill="#3c3489">untar alpine.tar → /tmp/thinbox/id/</text>
  <text font-family="sans-serif" font-size="12" x="30" y="146" text-anchor="start" fill="#b4b2a9">2</text>
  <line x1="340" y1="170" x2="340" y2="198" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="190" y="198" width="300" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="222" text-anchor="middle" dominant-baseline="central" fill="#04342c">Write cgroup limits</text>
  <text font-family="sans-serif" font-size="12" x="340" y="240" text-anchor="middle" dominant-baseline="central" fill="#085041">memory.max · cpu.max · pids.max</text>
  <text font-family="sans-serif" font-size="12" x="30" y="230" text-anchor="start" fill="#b4b2a9">3</text>
  <line x1="340" y1="254" x2="340" y2="282" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="190" y="282" width="300" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="306" text-anchor="middle" dominant-baseline="central" fill="#04342c">Fork with namespaces</text>
  <text font-family="sans-serif" font-size="12" x="340" y="324" text-anchor="middle" dominant-baseline="central" fill="#085041">CLONE_NEWPID · NEWNS · NEWUTS · NEWNET</text>
  <text font-family="sans-serif" font-size="12" x="30" y="314" text-anchor="start" fill="#b4b2a9">4</text>
  <line x1="340" y1="338" x2="340" y2="366" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="190" y="366" width="300" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="390" text-anchor="middle" dominant-baseline="central" fill="#04342c">pivot_root + bind mounts</text>
  <text font-family="sans-serif" font-size="12" x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="#085041">mount /proc /dev /sys inside</text>
  <text font-family="sans-serif" font-size="12" x="30" y="398" text-anchor="start" fill="#b4b2a9">5</text>
  <line x1="340" y1="422" x2="340" y2="450" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="190" y="450" width="300" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="474" text-anchor="middle" dominant-baseline="central" fill="#4a1b0c">exec /bin/sh</text>
  <text font-family="sans-serif" font-size="12" x="340" y="492" text-anchor="middle" dominant-baseline="central" fill="#712b13">fully isolated, sees itself as PID 1</text>
  <text font-family="sans-serif" font-size="12" x="30" y="482" text-anchor="start" fill="#b4b2a9">6</text>
</svg>
