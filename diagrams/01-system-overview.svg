<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>thinbox system architecture overview</title>
  <desc>Full stack diagram of thinbox from CLI down to Linux kernel</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- CLI -->
  <rect x="200" y="30" width="280" height="50" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="51" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">thinbox CLI</text>
  <text font-family="sans-serif" font-size="12" x="340" y="68" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">run · ps · exec · stop</text>

  <line x1="340" y1="80" x2="340" y2="108" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Runtime core outer -->
  <rect x="60" y="108" width="560" height="130" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="90" y="132" dominant-baseline="central" fill="#3c3489">Runtime core</text>

  <rect x="80" y="145" width="160" height="76" rx="8" fill="#cecbf6" stroke="#534ab7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="160" y="172" text-anchor="middle" dominant-baseline="central" fill="#26215c">Lifecycle</text>
  <text font-family="sans-serif" font-size="12" x="160" y="192" text-anchor="middle" dominant-baseline="central" fill="#3c3489">create, start, kill</text>

  <rect x="260" y="145" width="160" height="76" rx="8" fill="#cecbf6" stroke="#534ab7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="172" text-anchor="middle" dominant-baseline="central" fill="#26215c">State manager</text>
  <text font-family="sans-serif" font-size="12" x="340" y="192" text-anchor="middle" dominant-baseline="central" fill="#3c3489">JSON on disk</text>

  <rect x="440" y="145" width="160" height="76" rx="8" fill="#cecbf6" stroke="#534ab7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="520" y="172" text-anchor="middle" dominant-baseline="central" fill="#26215c">Image handler</text>
  <text font-family="sans-serif" font-size="12" x="520" y="192" text-anchor="middle" dominant-baseline="central" fill="#3c3489">tar extract, rootfs</text>

  <line x1="340" y1="238" x2="340" y2="266" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Isolation layer outer -->
  <rect x="60" y="266" width="560" height="130" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="90" y="290" dominant-baseline="central" fill="#085041">Isolation layer</text>

  <rect x="80" y="303" width="160" height="76" rx="8" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="160" y="330" text-anchor="middle" dominant-baseline="central" fill="#04342c">Namespaces</text>
  <text font-family="sans-serif" font-size="12" x="160" y="350" text-anchor="middle" dominant-baseline="central" fill="#085041">PID · MNT · UTS · NET</text>

  <rect x="260" y="303" width="160" height="76" rx="8" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="330" text-anchor="middle" dominant-baseline="central" fill="#04342c">cgroup v2</text>
  <text font-family="sans-serif" font-size="12" x="340" y="350" text-anchor="middle" dominant-baseline="central" fill="#085041">CPU · memory · pids</text>

  <rect x="440" y="303" width="160" height="76" rx="8" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="520" y="330" text-anchor="middle" dominant-baseline="central" fill="#04342c">Filesystem</text>
  <text font-family="sans-serif" font-size="12" x="520" y="350" text-anchor="middle" dominant-baseline="central" fill="#085041">pivot_root, bind mounts</text>

  <line x1="340" y1="396" x2="340" y2="424" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Linux kernel -->
  <rect x="60" y="424" width="560" height="56" rx="12" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="448" text-anchor="middle" dominant-baseline="central" fill="#4a1b0c">Linux kernel</text>
  <text font-family="sans-serif" font-size="12" x="340" y="466" text-anchor="middle" dominant-baseline="central" fill="#712b13">clone(2) · unshare(2) · pivot_root(2) · /sys/fs/cgroup</text>

  <line x1="340" y1="480" x2="340" y2="508" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Container process -->
  <rect x="160" y="508" width="360" height="56" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="532" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">Container process</text>
  <text font-family="sans-serif" font-size="12" x="340" y="550" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">Isolated PID 1 · own hostname · own rootfs</text>
</svg>
